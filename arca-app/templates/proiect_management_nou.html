{% extends "base.html" %}
{% block content %}
<h2>Proiect nou — Registru</h2>
<form method="post">
  <div class="card">
    <label for="cod_proiect">Cod proiect</label>
    <input type="text" id="cod_proiect" name="cod_proiect" required placeholder="ex: ARC-2026-048">
    <label for="client">Client</label>
    <input type="text" id="client" name="client" required>
    <label for="denumire">Denumire proiect</label>
    <input type="text" id="denumire" name="denumire" required>
    <label for="data_comanda">Data comanda acceptata</label>
    <input type="date" id="data_comanda" name="data_comanda" required>
    <label for="termen_promis">Termen promis clientului</label>
    <input type="date" id="termen_promis" name="termen_promis" required>
    <label for="termen_realizat">Termen realizat (daca e livrat deja)</label>
    <input type="date" id="termen_realizat" name="termen_realizat">
    <label for="valoare_fara_tva">Valoare fara TVA (RON)</label>
    <input type="number" step="0.01" min="0" id="valoare_fara_tva" name="valoare_fara_tva">
    <label for="marja_ofertata">Marja ofertata (%)</label>
    <input type="number" step="0.1" min="0" id="marja_ofertata" name="marja_ofertata">
    <label for="marja_realizata">Marja realizata (%, daca e livrat deja)</label>
    <input type="number" step="0.1" min="0" id="marja_realizata" name="marja_realizata">
    <label for="faza_curenta">Faza curenta</label>
    <select id="faza_curenta" name="faza_curenta">
      <option value="">-- alege --</option>
      {% for f in faze_flux %}
        <option value="{{ f }}">{{ f }}</option>
      {% endfor %}
      <option value="Livrat">Livrat</option>
    </select>
    <label for="observatii">Observatii</label>
    <textarea id="observatii" name="observatii" rows="2"></textarea>
  </div>
  <button type="submit" class="btn">Salveaza proiectul</button>
</form>
{% endblock %}
